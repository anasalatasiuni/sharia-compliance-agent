# Local development stack. Qdrant runs the same engine used in production
# (Qdrant Cloud), so retrieval behaviour — in particular payload filtering
# applied during ANN traversal — is identical between dev and prod.
services:
  qdrant:
    image: qdrant/qdrant:v1.12.4
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - ./qdrant_storage:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "bash -c ':> /dev/tcp/127.0.0.1/6333' || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build: .
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SCA_QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy
