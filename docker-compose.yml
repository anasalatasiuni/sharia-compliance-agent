# Local development stack. Qdrant runs the same engine used in production
# (Qdrant Cloud), so retrieval behaviour — in particular payload filtering
# applied during ANN traversal — is identical between dev and prod.
services:
  qdrant:
    # Pinned to match qdrant-client in pyproject. The client refuses to vouch
    # for a server more than one minor version away, and the Query API used for
    # hybrid search is exactly the surface that would drift.
    image: qdrant/qdrant:v1.19.0
    restart: unless-stopped
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      # A named volume rather than a bind mount: the container writes as root,
      # and a bind mount leaves a root-owned directory in the working tree that
      # the developer cannot delete without sudo.
      - qdrant_storage:/qdrant/storage
    healthcheck:
      # /healthz is Qdrant's own readiness endpoint; the previous TCP-connect
      # probe reported healthy before the collection layer was serving.
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/6333 && echo -e \"GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && grep -q healthz <&3'"]
      interval: 5s
      timeout: 3s
      retries: 12
      start_period: 10s

  api:
    build: .
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      SCA_QDRANT_URL: http://qdrant:6333
    depends_on:
      qdrant:
        condition: service_healthy

volumes:
  qdrant_storage:
