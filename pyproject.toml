[project]
name = "sharia-compliance-agent"
version = "0.1.0"
description = "Sharia compliance assessment agent with auditable RAG, for Mal's internal compliance team"
requires-python = ">=3.12"
dependencies = [
    "openai>=1.60",
    # Kept in the same minor band as the server image pinned in
    # docker-compose.yml. The client refuses to vouch for a server more
    # than one minor away, and hybrid search is the surface that drifts.
    "qdrant-client>=1.19,<2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
local-rerank = [
    "fastembed>=0.4",
]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "ruff>=0.7",
]

[project.scripts]
sharia-ingest = "sharia_agent.ingest.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/sharia_agent"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's dependency-injection markers are evaluated once at import by design.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.Query", "fastapi.Header", "fastapi.Path", "fastapi.Body",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]  # verbatim clause quotes must not be reflowed

[tool.pytest.ini_options]
pythonpath = ["src", "."]
asyncio_mode = "auto"
