# Render blueprint — https://render.com/docs/blueprint-spec
#
# Deploys the API only. Qdrant is a separate managed cluster (Qdrant Cloud free
# tier), because Render's free web service has no persistent disk and the index
# must survive a restart.
services:
  - type: web
    name: sharia-compliance-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free              # the service idles at ~148MB; free gives 512MB
    region: frankfurt       # closest free region to the UAE
    healthCheckPath: /health/live
    # Liveness, not readiness, and the reason is not cold starts — /health in
    # fact answers 200 from its first response, because the index lives in the
    # managed cluster and needs no warming.
    #
    # The reason is what happens when Qdrant is down. /health queries the
    # collection, so it answers 503, and Render responds to a failing health
    # check by restarting the instance — which fixes nothing, since the fault is
    # in a third party we cannot restart, and adds a cold start to an outage
    # already in progress. A platform's restart decision must not depend on a
    # dependency the platform cannot repair.
    #
    # It is also 320ms against 1ms per probe, repeatedly, on a free cluster.
    # Readiness stays ours to poll deliberately; liveness is the platform's.
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false         # set in the dashboard, never in the repo
      - key: SCA_QDRANT_URL
        sync: false         # https://<cluster>.<region>.cloud.qdrant.io:6333
      - key: SCA_QDRANT_API_KEY
        sync: false
      - key: SCA_PRINCIPALS
        sync: false         # NOT the demo token from .env.example — see README
      - key: SCA_ENV
        value: prod
      - key: SCA_LOG_FULL_PROMPTS
        value: "false"      # query text must not reach operational logs
      - key: SCA_RERANK_BACKEND
        value: llm          # `local` needs ~560MB more than the free tier has
      - key: SCA_MODEL
        value: anthropic/claude-haiku-4.5
      - key: SCA_MODEL_EFFORT
        value: none         # Haiku 4.5 predates reasoning-effort

      # Pinned rather than left to code defaults. These are the exact values the
      # eval baseline in PART2 §3.0 was measured at, so the deployed instance
      # provably matches the documented numbers instead of drifting with them.
      - key: SCA_RERANK_TOP_K
        value: "5"
      - key: SCA_MIN_MODEL_CONFIDENCE
        value: "0.70"
      - key: SCA_MIN_RERANK_SCORE
        value: "0.35"
      - key: SCA_MAX_RETRIEVAL_ROUNDS
        value: "3"

      # Lower than the code default of 8. Measured during eval runs: five
      # concurrent assessments were enough to trip the provider's rate limit,
      # and a 0.1-CPU free instance has no headroom to absorb the retries.
      # Excess load is shed with 429 + Retry-After rather than queued.
      - key: SCA_MAX_CONCURRENT_ASSESSMENTS
        value: "3"
